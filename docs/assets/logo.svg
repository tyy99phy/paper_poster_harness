<svg width="320" height="320" viewBox="0 0 320 320" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Paper Poster Harness logo</title>
  <desc id="desc">A scientific poster sheet with dashed figure placeholders and particle rings.</desc>
  <defs>
    <linearGradient id="bg" x1="26" y1="28" x2="294" y2="292" gradientUnits="userSpaceOnUse">
      <stop stop-color="#071A3A"/>
      <stop offset="0.55" stop-color="#0B315F"/>
      <stop offset="1" stop-color="#111827"/>
    </linearGradient>
    <linearGradient id="paper" x1="86" y1="58" x2="244" y2="262" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FBFF"/>
      <stop offset="1" stop-color="#EAF4FF"/>
    </linearGradient>
    <linearGradient id="accent" x1="61" y1="251" x2="260" y2="73" gradientUnits="userSpaceOnUse">
